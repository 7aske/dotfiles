# set status-utf8 on
# set utf8 on

set -g default-terminal "screen-256color"

set -g @prefix_highlight_fg 'black'
set -g @prefix_highlight_bg 'green'
set -g @prefix_highlight_show_copy_mode 'on'

set -g @plugin "nordtheme/tmux"
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'alexwforsythe/tmux-which-key'

run '~/.config/tmux/plugins/tpm/tpm'

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -s extended-keys always                # Handles Shift+Enter
set -as terminal-features 'xterm*:extkeys' # Fixes input signals
set -g allow-passthrough on                # Enables /copy command
set -s set-clipboard on                    # System clipboard sync
set -g focus-events on
set-hook -g client-session-changed 'if-shell -F "#{m:agent-*,#{session_name}}" "run-shell \"xdotool getactivewindow set_window --role tmux-#{session_name}\""'


# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

set -s escape-time 0

# split panes using v and h
unbind '"'
bind "|"    split-window -h  -c "#{pane_current_path}"
bind "\\"   split-window -fh -c "#{pane_current_path}"
bind "-"    split-window -v  -c "#{pane_current_path}"
bind '"'    split-window -v  -c "#{pane_current_path}"
bind "_"    split-window -fv -c "#{pane_current_path}"

bind x kill-pane
bind X kill-window
bind C-x confirm-before -p "kill other windows? (y/n)" "kill-window -a"
bind Q confirm-before -p "kill-session #S? (y/n)" kill-session

#unbind n
#unbind p
bind -r C-h previous-window # select previous window
bind -r C-l next-window     # select next window
bind Tab last-window        # move to last active window

bind j choose-window 'join-pane -h -s "%%"'
bind J choose-window 'join-pane -s "%%"'

set -g renumber-windows on
set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows
setw -g automatic-rename on   # rename window to reflect current program
bind c new-window -c "#{pane_current_path}"

bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# vi mode copy and selection
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# pipe tmux clipboard to system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

setw -g mode-style "fg=color0 bg=color2"
## statusbar
set -g status-position bottom
set -g status-left-length 100   # default 10 truncates the session name

set -g window-status-bell-style "fg=color0,bg=color1"
set -g monitor-activity on    # on: '#' flag + green tab
set -g monitor-silence 60     # '~' flag only, no colour change
set -g window-status-activity-style "fg=color0,bg=color2"

# nord's window-status-format hardcodes #[fg=..,bg=..] on every segment, which
# overrides the bell/activity styles, so pick colours from the alert flags
# (bell wins over activity)
set -g @alert-bg "#{?window_bell_flag,red,#{?window_activity_flag,green,brightblack}}"
set -g @alert-fg "#{?#{||:#{window_bell_flag},#{window_activity_flag}},black,white}"
# replaces #F: active, last, bell, activity, silence, zoomed, marked
set -g @flags "#{?window_active,● ,}#{?window_last_flag,○ ,}#{?window_bell_flag,󰂚 ,}#{?window_activity_flag,󰣖 ,}#{?window_silence_flag,󰒲 ,}#{?window_zoomed_flag,󰍉 ,}#{?window_marked_flag,󰍎 ,}"
set -g window-status-format "#[fg=black,bg=#{E:@alert-bg},nobold,noitalics,nounderscore] #[fg=#{E:@alert-fg},bg=#{E:@alert-bg}]#I #[fg=#{E:@alert-fg},bg=#{E:@alert-bg},nobold,noitalics,nounderscore] #[fg=#{E:@alert-fg},bg=#{E:@alert-bg}]#W #{E:@flags}#[fg=#{E:@alert-bg},bg=black,nobold,noitalics,nounderscore]"
set -g window-status-current-format "#[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#I #[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#W #{E:@flags}#[fg=cyan,bg=black,nobold,noitalics,nounderscore]"
