onboarding = false
[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
# tmux: bind Q confirm-before ... — herdr confirms workspace close
confirm_close = true
# tmux creates windows immediately with no name prompt
prompt_new_tab_name = false
# tmux: set -g mouse on  +  set -s set-clipboard on / copy-pipe to clipboard
mouse_capture = true
copy_on_select = true
hide_tab_bar_when_single_tab = true
prompt_new_workspace_name = true

tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "~/.local/share/agent-statusline/statusline.sh", interval_seconds = 5, timeout_seconds = 2 },
]
tab_bar_right_separator = " | "
status_indicators = "dots"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent", "machine"],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [ 
    { token = "$git_clean",    fg = "#a6e3a1" },   # fully clean ✓ — green
    { token = "$git_dirty",    fg = "#f9e2af" },   # +staged ~modified ?untracked — yellow
    { token = "$git_conflict", fg = "#f38ba8" },   # !conflicts — red
  ],
]

[theme]
# tmux: set -g @plugin "nordtheme/tmux"
name = "nord"
auto_switch = false
dark_name = "nord"
light_name = "nord"

[theme.custom]
surface_dim = "#434C5E"
active_row_bg = "#3B4252"
selection_bg = "#5E81AC"
overlay0 = "#81A1C1"
accent = "#B48EAD"

[ui.toast]
delivery = "system"

[keys]
# --- tmux bindings ported (source: ~/.config/tmux/.tmux.conf) ---
# tmux: set-option -g prefix C-a
prefix = "ctrl+a"

# --- Splits -------------------------------------------------------------
# tmux: bind "|" split-window -h   (side-by-side)
split_vertical = ["prefix+|", "prefix+%"]
# tmux: bind "-" split-window -v   (stacked)
split_horizontal = ["prefix+minus", "prefix+\""]

# --- Kill / close -------------------------------------------------------
# tmux: bind x kill-pane
close_pane = "prefix+x"
# tmux: bind X kill-window
close_tab = "prefix+shift+x"
# tmux: bind Q confirm-before kill-session
close_workspace = "prefix+shift+q"
detach = "prefix+d"
goto = "prefix+s"
# free prefix+o for codeopen (default: open_notification_target)
open_notification_target = "prefix+shift+o"
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

# --- Tabs (tmux windows) ------------------------------------------------
# tmux: bind c new-window
new_tab = "prefix+c"
# tmux: bind -r C-h previous-window
previous_tab = "prefix+ctrl+h"
# tmux: bind -r C-l next-window
next_tab = "prefix+ctrl+l"
previous_workspace = "prefix+p"
next_workspace = "prefix+n"

# --- Pane focus (tmux: bind -n C-Arrow select-pane, no prefix) ----------
focus_pane_left = ["ctrl+left", "prefix+left"]
focus_pane_right = ["ctrl+right", "prefix+right"]
focus_pane_up = ["ctrl+up", "prefix+up"]
focus_pane_down = ["ctrl+down", "prefix+down"]

# --- Config reload ------------------------------------------------------
# tmux: bind r source-file ~/.tmux.conf
reload_config = "prefix+r"
# moved off prefix+r (herdr default) so it doesn't clash with reload
resize_mode = "prefix+shift+r"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+o"
type = "popup"
command = "codeopen -t herdr"
description = "open project in herdr"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[[keys.command]]
key = "prefix+shift+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"
